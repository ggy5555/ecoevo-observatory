name: Verify Legacy + LAB 2.0
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all tests
        run: npm test
