name: UI Browser Smoke — Observatory and LAB 2.0

on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright for CI only
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interactions and responsive smoke
        run: node tests/ui-browser.smoke.mjs
      - name: Save visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecoevo-ui-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
